<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Data — Agent Sidebar</title>
  <style>
    /* ── Reset & Base ────────────────────────────── */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #1a1a1a;
      --bg-card: #242424;
      --bg-row-hover: #2c2c2c;
      --text-primary: #ffffff;
      --text-secondary: #a3a3a3;
      --text-muted: #737373;
      --zd-green: #17494d;
      --zd-green-bright: #228f67;
      --zd-green-glow: rgba(34, 143, 103, 0.15);
      --border: #333333;
      --radius: 6px;
      --transition: 180ms ease;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      width: 300px;
      min-height: 100vh;
      padding: 16px 14px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Loading State ───────────────────────────── */
    .loader-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 64px 0;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--zd-green-bright);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loader-text {
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* ── Error State ─────────────────────────────── */
    .error-wrap {
      text-align: center;
      padding: 48px 12px;
    }

    .error-icon {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .error-msg {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.45;
      margin-bottom: 14px;
    }

    .retry-btn {
      background: var(--zd-green-bright);
      color: #fff;
      border: none;
      padding: 7px 18px;
      border-radius: var(--radius);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity var(--transition);
    }

    .retry-btn:hover {
      opacity: 0.85;
    }

    /* ── Profile Card ────────────────────────────── */
    .profile-card {
      animation: fadeUp 0.35s ease both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* VIP Badge */
    .vip-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--zd-green-glow);
      border: 1px solid rgba(34, 143, 103, 0.35);
      color: var(--zd-green-bright);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 14px;
    }

    .vip-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--zd-green-bright);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }
    }

    /* Header area */
    .profile-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--zd-green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: var(--zd-green-bright);
      flex-shrink: 0;
      border: 2px solid rgba(34, 143, 103, 0.3);
    }

    .profile-name {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.25;
    }

    .profile-username {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 4px 0 12px;
    }

    /* Section label */
    .section-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    /* Data rows */
    .data-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 7px 8px;
      border-radius: var(--radius);
      transition: background var(--transition);
    }

    .data-row:hover {
      background: var(--bg-row-hover);
    }

    .data-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .data-icon svg {
      width: 14px;
      height: 14px;
      stroke: var(--zd-green-bright);
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .data-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .data-value {
      font-size: 13px;
      color: var(--text-primary);
      word-break: break-all;
      line-height: 1.35;
    }

    /* Stat Grid */
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 4px;
    }

    .stat-cell {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 8px 10px;
      transition: background var(--transition);
    }

    .stat-cell:hover {
      background: var(--bg-row-hover);
    }

    .stat-cell .data-label {
      margin-bottom: 3px;
    }

    .stat-cell .data-value {
      font-size: 14px;
      font-weight: 600;
    }

    /* Beta Key */
    .beta-key-box {
      background: var(--bg-card);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 8px 10px;
      margin: 6px 0 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .beta-key-code {
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 12px;
      color: var(--zd-green-bright);
      letter-spacing: 0.5px;
    }

    .beta-key-status {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 2px 7px;
      border-radius: 10px;
    }

    .beta-key-status.unredeemed {
      background: rgba(234, 179, 8, 0.15);
      color: #eab308;
      border: 1px solid rgba(234, 179, 8, 0.3);
    }

    .beta-key-status.redeemed {
      background: var(--zd-green-glow);
      color: var(--zd-green-bright);
      border: 1px solid rgba(34, 143, 103, 0.3);
    }

    /* Purchase Rows */
    .purchase-row {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 8px 10px;
      margin-bottom: 5px;
      transition: background var(--transition);
    }

    .purchase-row:hover {
      background: var(--bg-row-hover);
    }

    .purchase-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .purchase-item {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .purchase-amount {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .purchase-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .purchase-id {
      font-size: 10px;
      color: var(--text-muted);
      font-family: "SF Mono", "Fira Code", monospace;
    }

    .purchase-status {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 1px 6px;
      border-radius: 8px;
      background: var(--zd-green-glow);
      color: var(--zd-green-bright);
      border: 1px solid rgba(34, 143, 103, 0.3);
    }

    /* Duplicate flag */
    .flag-banner {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(234, 179, 8, 0.1);
      border: 1px solid rgba(234, 179, 8, 0.25);
      border-radius: var(--radius);
      padding: 6px 10px;
      margin-bottom: 8px;
    }

    .flag-icon {
      font-size: 13px;
      flex-shrink: 0;
    }

    .flag-text {
      font-size: 11px;
      color: #eab308;
      line-height: 1.3;
    }

    /* Footer */
    .footer {
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      text-align: center;
    }

    .footer-text {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.3px;
    }
  </style>
</head>

<body>

  <div id="app">
    <!-- Loading state rendered by JS -->
  </div>

  <script>
    const app = document.getElementById('app');

    // ── SVG Icon Paths ──────────────────────────────
    const icons = {
      user: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
      mail: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
      globe: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
      wifi: '<path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/>',
      shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
      key: '<path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>',
      server: '<rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/>',
      clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
      gamepad: '<line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="15" y1="13" x2="15.01" y2="13"/><line x1="18" y1="11" x2="18.01" y2="11"/><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"/>',
      hash: '<line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/>',
      cart: '<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>'
    };

    function svgIcon(name) {
      return `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">${icons[name]}</svg>`;
    }

    // ── Render Helpers ──────────────────────────────
    function renderLoading() {
      app.innerHTML = `
        <div class="loader-wrap">
          <div class="spinner"></div>
          <div class="loader-text">Loading player data…</div>
        </div>`;
    }

    function renderError(msg) {
      app.innerHTML = `
        <div class="error-wrap">
          <div class="error-icon">⚠️</div>
          <div class="error-msg">${msg}</div>
          <button class="retry-btn" onclick="loadData()">Retry</button>
        </div>`;
    }

    function dataRow(icon, label, value) {
      return `
        <div class="data-row">
          <div class="data-icon">${svgIcon(icon)}</div>
          <div>
            <div class="data-label">${label}</div>
            <div class="data-value">${value}</div>
          </div>
        </div>`;
    }

    function statCell(label, value) {
      return `
        <div class="stat-cell">
          <div class="data-label">${label}</div>
          <div class="data-value">${value}</div>
        </div>`;
    }

    function detectDuplicatePurchases(purchases) {
      const seen = {};
      let hasDupes = false;
      for (const p of purchases) {
        const key = `${p.item}|${p.amount}|${p.date}`;
        if (seen[key]) { hasDupes = true; break; }
        seen[key] = true;
      }
      return hasDupes;
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function formatLastLogin(isoStr) {
      const d = new Date(isoStr);
      return d.toLocaleString('en-US', {
        month: 'short', day: 'numeric',
        hour: 'numeric', minute: '2-digit',
        hour12: true
      });
    }

    function renderProfile(data) {
      const initials = data.username.slice(0, 2).toUpperCase();
      const stats = data.game_stats;
      const beta = data.beta_access;
      const tech = data.technical_info;
      const purchases = data.recent_purchases || [];
      const hasDupes = detectDuplicatePurchases(purchases);

      const betaStatusClass = beta.key_redeemed ? 'redeemed' : 'unredeemed';
      const betaStatusText = beta.key_redeemed ? 'Redeemed' : 'Not Redeemed';

      const purchaseRows = purchases.map(p => `
        <div class="purchase-row">
          <div class="purchase-header">
            <span class="purchase-item">${p.item}</span>
            <span class="purchase-amount">$${p.amount.toFixed(2)}</span>
          </div>
          <div class="purchase-meta">
            <span class="purchase-id">${p.transaction_id} · ${formatDate(p.date)}</span>
            <span class="purchase-status">${p.status}</span>
          </div>
        </div>`).join('');

      app.innerHTML = `
        <div class="profile-card">
          <div class="vip-badge">
            <span class="vip-dot"></span>
            ${data.vip_tier} · ${data.account_status}
          </div>

          <div class="profile-header">
            <div class="avatar">${initials}</div>
            <div>
              <div class="profile-name">${data.username}</div>
              <div class="profile-username">${data.player_id}</div>
            </div>
          </div>

          ${dataRow('mail', 'Email', data.email)}

          <div class="divider" style="margin-top:8px"></div>

          <div class="section-label">Game Stats</div>
          <div class="stat-grid">
            ${statCell('Level', stats.level)}
            ${statCell('Playtime', stats.total_playtime_hours + 'h')}
            ${statCell('Guild', stats.guild)}
            ${statCell('Region', stats.server_region)}
          </div>

          <div class="divider" style="margin-top:8px"></div>

          <div class="section-label">Beta Access</div>
          ${dataRow('shield', 'Status', beta.status + ' · ' + beta.platform)}
          <div class="beta-key-box">
            <span class="beta-key-code">${beta.key}</span>
            <span class="beta-key-status ${betaStatusClass}">${betaStatusText}</span>
          </div>

          <div class="divider" style="margin-top:12px"></div>

          <div class="section-label">Recent Purchases</div>
          ${hasDupes ? `
            <div class="flag-banner">
              <span class="flag-icon">⚠️</span>
              <span class="flag-text">Possible duplicate transaction detected</span>
            </div>` : ''}
          ${purchaseRows}

          <div class="divider" style="margin-top:12px"></div>

          <div class="section-label">Technical Info</div>
          ${dataRow('globe', 'IP Address', tech.ip_address)}
          ${dataRow('wifi', 'MAC Address', tech.mac_address)}
          ${dataRow('clock', 'Last Login', formatLastLogin(tech.last_login))}

          <div class="footer">
            <div class="footer-text">Hero Corp · Agent Workspace</div>
          </div>
        </div>`;
    }

    // ── Data Fetch ──────────────────────────────────
    async function loadData() {
      renderLoading();

      try {
        const res = await fetch('./player-data.json');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const user = await res.json();
        renderProfile(user);
      } catch (err) {
        renderError(`Failed to load player data.<br><small>${err.message}</small>`);
      }
    }

    // ── Init ────────────────────────────────────────
    loadData();
  </script>
</body>

</html>
